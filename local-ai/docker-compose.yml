# Open WebUI + Ollama with NVIDIA GPU access.
# Secrets come from a .env file next to this compose file (see .env.example).
services:
  open-webui:
    container_name: openwebui
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - /open-webui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
    restart: unless-stopped
  ollama:
    container_name: ollama
    image: ollama/ollama:0.11.10
    # NOTE: published on all host interfaces with no authentication.
    # Restrict with a host firewall, or bind to 127.0.0.1 and point Open WebUI
    # at http://ollama:11434 over the compose network instead.
    ports:
      - "11434:11434"
    volumes:
      - /ollama:/root/.ollama
    extra_hosts:
      - host.docker.internal:host-gateway
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama:
  open-webui:
